name: student_os
description: "StudentOS - Your Academic Superpower. A comprehensive student productivity platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # UI & Design
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0

  # Charts
  fl_chart: ^0.68.0

  # Storage
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # HTTP & API
  dio: ^5.6.0
  http: ^1.2.1
  retrofit: ^4.1.0

  # File handling
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  open_filex: ^4.4.0

  # Camera / OCR
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/

