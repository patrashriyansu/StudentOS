name: StudentOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./studentos_ci.db
      SECRET_KEY: ci-only-studentos-secret-key
      SEED_DEMO_DATA: "false"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-render.txt
      - run: pip install -r backend/requirements-render.txt pytest
      - run: pytest -q backend/tests
